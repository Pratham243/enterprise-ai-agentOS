# =============================================================================
# Enterprise AI AgentOS — Docker Compose (local development)
# =============================================================================
# Runs the API alongside PostgreSQL and (optionally) n8n.
#
# Start:  docker compose up -d
# Stop:   docker compose down
# Logs:   docker compose logs -f api
# =============================================================================

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://agentos:agentos@db:5432/agentos
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: agentos
      POSTGRES_DB: agentos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Uncomment when ready for workflow automation (Step 10):
  # n8n:
  #   image: n8nio/n8n:latest
  #   ports:
  #     - "5678:5678"
  #   environment:
  #     - WEBHOOK_URL=http://api:8000/webhooks/trigger
  #   restart: unless-stopped

volumes:
  pgdata:
